<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>買い物リスト | とっとく</title><link rel="icon" href="../icon.png"><link rel="apple-touch-icon" href="../icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet"><style>
body{font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;background:#F5F4F0;color:#1A1A1E;margin:0}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;font-weight:900;margin:8px 0 2px}.muted{color:#5F6068;font-size:13px}
h2{font-size:13px;font-weight:900;color:#5F6068;margin:22px 0 6px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E4E2DC;border-radius:12px;padding:12px 14px;margin:6px 0;cursor:pointer;user-select:none}
.box{width:24px;height:24px;border-radius:12px;border:2px solid #5F6068;flex:none;display:flex;align-items:center;justify-content:center}
.done .box{background:#166534;border-color:#166534}.done .box:after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg);margin-top:-3px}
.done .name{text-decoration:line-through;color:#8E8A83}.name{flex:1;font-size:16px}.q{color:#5F6068;font-size:14px}
form{position:fixed;left:0;right:0;bottom:0;background:#F5F4F0;border-top:1px solid #E4E2DC;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
form div{max-width:560px;margin:0 auto;display:flex;gap:8px}
input{flex:1;height:48px;border-radius:12px;border:1px solid #E4E2DC;padding:0 14px;font:inherit;font-size:16px}
button{height:48px;border:0;border-radius:12px;background:#1A1A1E;color:#fff;font:inherit;font-weight:700;padding:0 18px}
a.app{display:inline-block;margin-top:10px;font-weight:700;font-size:14px;color:#1A1A1E}
.err{background:#FFF8EC;border-radius:12px;padding:14px;margin-top:20px}
</style></head><body><main>
<div class="muted">とっとく</div><h1>買い物リスト</h1>
<div class="muted" id="info">読み込んでいます…</div>
<div id="list"></div>
<a class="app hide" id="app" href="#">とっとくアプリで一緒に使う（自分の買い物タブにも並びます）</a>
</main>
<form id="add"><div><input id="name" placeholder="足す（例：卵）" autocomplete="off" maxlength="60"><button>足す</button></div></form>
<script>
const API = "https://ckdlguqmscqhveuoeljf.supabase.co/functions/v1/lists";
const ORDER = ["野菜・果物","肉・魚","卵・乳製品","豆腐・納豆・練り物","米・パン・麺","調味料・油","乾物・缶詰・粉","冷凍食品","お菓子・飲み物・お酒","日用品","コスメ・薬","その他"];
const code = new URLSearchParams(location.search).get("c") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let items = [], busy = false;
$("app").href = "tottoku://shop?code=" + encodeURIComponent(code);
function render() {
  const open = items.filter((i) => !i.done), done = items.filter((i) => i.done);
  $("info").textContent = `まだ ${open.length}品・買った ${done.length}品（押すとチェック。ほかの人にもすぐ反映されます）`;
  const groups = {};
  for (const i of open) (groups[i.aisle || "その他"] ??= []).push(i);
  const keys = Object.keys(groups).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const row = (i) => `<div class="item ${i.done ? "done" : ""}" data-id="${esc(i.id)}"><span class="box"></span><span class="name">${esc(i.name)}</span>${i.quantity ? `<span class="q">${esc(i.quantity)}</span>` : ""}</div>`;
  $("list").innerHTML = keys.map((k) => `<h2>${esc(k)}</h2>${groups[k].map(row).join("")}`).join("") + (done.length ? `<h2>買ったもの</h2>${done.map(row).join("")}` : "");
  $("app").classList.remove("hide");
}
async function load() {
  if (busy) return;
  const r = await fetch(`${API}?shop=${encodeURIComponent(code)}`).then((r) => r.json()).catch(() => ({ error: "通信できませんでした" }));
  if (r.error) { $("list").innerHTML = `<div class="err">${esc(r.error)}</div>`; $("info").textContent = ""; $("add").style.display = "none"; return; }
  items = r.items; render();
}
async function post(body) {
  busy = true;
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ shop: code, ...body }) }).then((r) => r.json()).catch(() => null);
  busy = false;
  if (r && r.items) { items = r.items; render(); }
}
$("list").addEventListener("click", (e) => {
  const el = e.target.closest("[data-id]"); if (!el) return;
  const it = items.find((x) => x.id === el.dataset.id); if (!it) return;
  it.done = !it.done; render(); post({ action: "shop_toggle", id: it.id, done: it.done });
});
$("add").addEventListener("submit", (e) => {
  e.preventDefault(); const name = $("name").value.trim(); if (!name) return;
  $("name").value = ""; items.push({ id: "tmp" + Date.now(), name, done: false }); render(); post({ action: "shop_add", name });
});
load(); setInterval(() => document.visibilityState === "visible" && load(), 4000);
</script>
<style>.hide{display:none}</style>
</body></html>
