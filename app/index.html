<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とっとく</title>
<meta name="description" content="SNSで保存した投稿を、行く・作る・買う・観る・知るに自動で分けて整理するアプリ。ブラウザ版。">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-itunes-app" content="app-id=6839922621, app-argument=https://tottoku-app.jp/app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--card:#fff;--ink:#1A1A1E;--sub:#5F6068;--line:#E4E2DC;--warn:#FFF8EC;--danger:#B91C1C;--ok:#166534;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.hide{display:none!important}
.muted{color:var(--sub)}
.small{font-size:13px}
.bold{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;font-weight:700;border-radius:12px;padding:10px 16px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #F1D4D4}
.btn[disabled]{opacity:.45;cursor:default}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
.field:focus{border-color:var(--ink)}
/* ログイン */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;text-align:center}
.login-card img{width:64px;height:64px;border-radius:16px}
.login-card h1{font-size:26px;font-weight:900;margin:12px 0 4px}
.code{display:flex;gap:8px;justify-content:center;margin:22px 0 10px}
.code input{width:100%;max-width:280px;text-align:center;font-size:28px;font-weight:900;letter-spacing:6px;text-transform:uppercase;border:2px solid var(--line);border-radius:14px;padding:10px}
.code input:focus{outline:none;border-color:var(--ink)}
.steps{text-align:left;background:var(--bg);border-radius:14px;padding:14px 16px;margin:18px 0 0;font-size:13px;color:var(--sub)}
.steps ol{margin:0;padding-left:20px}
/* 画面の枠 */
header{position:sticky;top:0;z-index:20;background:rgba(245,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:8px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px 9px 38px;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{padding:8px 13px;border-radius:999px;font-weight:700;color:var(--sub)}
nav.tabs button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
main{max-width:1240px;margin:0 auto;padding:20px 20px 120px}
@media (max-width:820px){
  header{backdrop-filter:none;background:var(--bg)}
  .bar{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .search{order:3;flex-basis:100%;max-width:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
  nav.tabs button{flex:1;padding:8px 4px}
  main{padding:14px 14px 120px}
}
/* 分類チップ */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.chip .n{font-weight:500;color:var(--sub);font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .n{color:#D4D4D8}
.chip.warn{background:var(--warn);border-color:#F3DFB5}
.tag{display:inline-block;font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:4px}
/* 取り込み中 */
.pending{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pend{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.pend .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:#C2410C;flex:none;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
/* カード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .08s,box-shadow .12s}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.07);transform:translateY(-1px)}
.thumb{aspect-ratio:16/10;background:#EEEDE8;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{aspect-ratio:auto;height:44px}
.thumb.none .ph{font-size:15px;justify-content:flex-start;padding-left:14px}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .t{font-weight:700;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--sub);margin-top:auto;padding-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.ai{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.ai .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ai .row:first-of-type{border-top:0}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* 詳細（右から出るパネル） */
.veil{position:fixed;inset:0;background:rgba(26,26,30,.35);z-index:40;display:flex;justify-content:flex-end}
.panel{width:100%;max-width:560px;height:100%;background:var(--bg);overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12);animation:in .16s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:.5}}
.panel .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(245,244,240,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.panel .in{padding:18px 20px 60px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:22px;font-weight:900;line-height:1.4;margin:0}
.hero{border-radius:var(--r);overflow:hidden;background:#EEEDE8;max-height:320px}
.hero img{width:100%;max-height:320px;object-fit:cover;display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box h3{font-size:14px;margin:0 0 8px;font-weight:700}
.place{padding:10px 0;border-top:1px solid var(--line)}
.place:first-of-type{border-top:0;padding-top:0}
.place.warn{background:var(--warn);margin:0 -16px;padding:10px 16px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{padding:6px 12px;border-radius:10px;font-weight:700;font-size:14px;border:1.5px solid transparent}
textarea.field{min-height:84px;resize:vertical}
ul.clean{margin:0;padding-left:20px}
ol.steps2{margin:0;padding-left:22px}
ol.steps2 li{margin:4px 0}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(26,26,30,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet h2{margin:0;font-size:20px;font-weight:900}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--sub);font-size:14px}
.drop.over{border-color:var(--ink);background:var(--bg)}
/* 地図 */
#map{height:calc(100vh - 190px);min-height:420px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
@media (max-width:820px){#map{height:calc(100vh - 230px)}}
.leaflet-popup-content{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px}
/* リスト・買い物 */
.cols{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.li.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.shop{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.shop.done span{text-decoration:line-through;color:var(--sub)}
.aisle{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:900;margin:0}
</style>
</head>
<body>

<!-- つなぐ前：アプリで出したコードを入れる -->
<section id="login" class="hide">
  <div class="login-card">
    <img src="../icon.png" alt="">
    <h1>とっとく ブラウザ版</h1>
    <p class="muted small" style="margin:0">スマホのアプリと同じ保存を、パソコンで見られます</p>
    <form id="codeForm">
      <div class="code"><input id="codeIn" maxlength="9" autocomplete="one-time-code" placeholder="XXXX XXXX" aria-label="8文字のコード"></div>
      <button class="btn" id="codeBtn" style="width:100%;max-width:280px;padding:13px">つなぐ</button>
      <p id="codeErr" class="small" style="color:var(--danger);min-height:22px;margin:8px 0 0"></p>
    </form>
    <div class="steps">
      <b style="color:var(--ink)">コードの出し方</b>
      <ol>
        <li>スマホで「とっとく」アプリを開く</li>
        <li>「設定」→「パソコンのブラウザで使う」</li>
        <li>「ブラウザ用のコードを出す」を押す</li>
      </ol>
    </div>
    <div class="steps" style="margin-top:14px">
      <b style="color:var(--ink)">アプリをまだ入れていない方</b>
      <p class="small" style="margin:6px 0 10px">ブラウザ版は、スマホのアプリとつないで使います。まずスマホに入れてください（無料）。</p>
      <div class="links" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <a class="btn sm" href="https://apps.apple.com/jp/app/id6839922621" target="_blank" rel="noopener">App Storeで入れる</a>
        <a class="btn out sm" href="https://line.me/R/msg/text/?とっとく（SNSの保存を整理するアプリ）%0Ahttps://apps.apple.com/jp/app/id6839922621" target="_blank" rel="noopener">スマホにLINEで送る</a>
      </div>
    </div>
  </div>
</section>

<!-- 本体 -->
<div id="app" class="hide">
  <header>
    <div class="bar">
      <a class="brand" href="./"><img src="../icon.png" alt="">とっとく</a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6068" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="探す（Enter で AI にも聞く）">
      </div>
      <nav class="tabs" id="tabs">
        <button data-v="list" class="on">一覧</button>
        <button data-v="map">地図</button>
        <button data-v="plans">予定</button>
        <button data-v="lists">リスト</button>
        <button data-v="shop">買い物</button>
      </nav>
      <div class="spacer"></div>
      <button class="btn" id="addBtn" title="リンクや画像を保存（Ctrl+V でも保存できます）">＋ 保存</button>
      <button class="btn out sm" id="appBtn" title="スマホのアプリで開く・アプリでできること">アプリで開く</button>
      <button class="btn out sm" id="menuBtn" title="設定">設定</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="layer"></div>
<div id="toast" class="toast hide"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.4";

const SUPABASE_URL = "https://ckdlguqmscqhveuoeljf.supabase.co";
const SUPABASE_KEY = "sb_publishable_pot0bQHpKI99vRPcwu_TYQ_wgx7X945"; // 公開してよい publishable キー
const LINKED = "tottoku.web.linked";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "tottoku.web.auth" } });

const CAT = {
  go:    { label: "行く", sub: "お店・スポット", bg: "#FFEDD5", fg: "#9A3412", accent: "#C2410C" },
  cook:  { label: "作る", sub: "レシピ", bg: "#DCFCE7", fg: "#166534", accent: "#15803D" },
  buy:   { label: "買う", sub: "コスメ・物", bg: "#EDE9FE", fg: "#5B21B6", accent: "#6D28D9" },
  watch: { label: "観る", sub: "作品・推し・おもしろ", bg: "#DBEAFE", fg: "#1E40AF", accent: "#1D4ED8" },
  learn: { label: "知る", sub: "知識・ワザ", bg: "#FEF3C7", fg: "#92400E", accent: "#B45309" },
};
const CATS = Object.keys(CAT);
const PLATFORM = { instagram: "Instagram", tiktok: "TikTok", facebook: "Facebook", x: "X", youtube: "YouTube", web: "Web", screenshot: "スクショ", photo: "写真", voice: "音声" };
const SAVE_SELECT = "id, profile_id, platform, source_url, author, title, summary, categories, tags, is_pr, deadline, details, needs_review, memo, created_at, thumbnail_url, plan_date, plan_slot, done_at, places(id, save_id, name, area, address, google_place_id, lat, lng, notes, needs_confirm, candidates, visited, opening_hours, price_range, google_rating, google_rating_count, maps_uri)";
const LIST_COLORS = ["#C2410C", "#15803D", "#6D28D9", "#1D4ED8", "#B45309", "#BE185D", "#0F766E", "#1A1A1E"];

const S = { me: null, saves: [], extra: {}, failed: [], pending: [], view: "list", cat: "all", q: "", ai: null, lists: null, listId: null, shop: null, mapObj: null };

// ---------- 小物 ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tag = (c) => CAT[c] ? `<span class="tag" style="background:${CAT[c].bg};color:${CAT[c].fg}">${CAT[c].label}</span>` : "";
const fmtDate = (d) => { const x = new Date(d); return `${x.getMonth() + 1}/${x.getDate()}`; };
const mapsUrl = (p) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([p.name, p.address].filter(Boolean).join(" ")) + (p.google_place_id ? "&query_place_id=" + p.google_place_id : "");
const tabelogUrl = (p) => "https://tabelog.com/rstLst/?sw=" + encodeURIComponent([p.name, p.area].filter(Boolean).join(" "));
const rakutenUrl = (q) => `https://search.rakuten.co.jp/search/mall/${encodeURIComponent(q)}/`;
const amazonUrl = (q) => `https://www.amazon.co.jp/s?k=${encodeURIComponent(q)}`;
const addr = (a) => (a || "").replace(/^日本、?\s*/, "").replace(/^〒\d{3}-\d{4}\s*/, "");
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("hide"), 2600); }

async function call(fn, body) {
  const { data } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${data.session?.access_token ?? ""}` },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.error) throw new Error(json.error ?? `通信エラー（${res.status}）`);
  return json;
}

// 営業時間（Google の regularOpeningHours）
function isOpenNow(h, now = new Date()) {
  const ps = h?.periods; if (!ps?.length) return null;
  if (ps.length === 1 && !ps[0].close) return true;
  const t = now.getDay() * 1440 + now.getHours() * 60 + now.getMinutes(), wk = 7 * 1440;
  return ps.some((p) => { if (!p.close) return false; const o = p.open.day * 1440 + p.open.hour * 60 + p.open.minute; let c = p.close.day * 1440 + p.close.hour * 60 + p.close.minute; if (c <= o) c += wk; return (t >= o && t < c) || (t + wk >= o && t + wk < c); });
}
function todayHours(h, now = new Date()) { const l = h?.weekdayDescriptions; if (!l?.length) return null; return (l[(now.getDay() + 6) % 7] ?? "").replace(/^[^:：]+[:：]\s*/, ""); }

// ---------- つなぐ ----------
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session || localStorage.getItem(LINKED) !== "1") return showLogin();
  try {
    S.me = await call("ingest", { action: "me" });
    if (!S.me.web) { await sb.auth.signOut(); localStorage.removeItem(LINKED); return showLogin(); }
  } catch { return showLogin("つながりが切れました。もう一度コードを入れてください"); }
  showApp();
}

function showLogin(msg = "") {
  $("app").classList.add("hide"); $("login").classList.remove("hide");
  $("codeErr").textContent = msg; setTimeout(() => $("codeIn").focus(), 50);
}

$("codeIn").addEventListener("input", (e) => {
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  e.target.value = v.length > 4 ? v.slice(0, 4) + " " + v.slice(4) : v;
});
$("codeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("codeIn").value.replace(/\s/g, "");
  if (code.length !== 8) return ($("codeErr").textContent = "8文字のコードを入れてください");
  $("codeBtn").disabled = true; $("codeErr").textContent = "";
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }
    await call("ingest", { action: "web_link", code });
    localStorage.setItem(LINKED, "1");
    $("codeIn").value = "";
    await boot();
  } catch (err) { $("codeErr").textContent = err.message || "つなげませんでした"; }
  finally { $("codeBtn").disabled = false; }
});

// ---------- 本体 ----------
function showApp() {
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  const v = location.hash.replace("#", "");
  if (["list", "map", "plans", "lists", "shop"].includes(v)) S.view = v;
  // 拡張機能・ブックマークから「このページを保存」で来たとき
  const sv = new URLSearchParams(location.search).get("save");
  if (sv) { history.replaceState(null, "", location.pathname + location.hash); saveUrls(sv); }
  // Notion から戻ってきたとき
  const nq = new URLSearchParams(location.search).get("notion");
  if (nq) { history.replaceState(null, "", location.pathname + location.hash); if (nq === "ok") { toast("Notionとつながりました。書き出しています…"); notionSync(); } else toast("Notionとつなげませんでした"); }
  setTabs(); load(); subscribe();
}

function setTabs() { document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.view)); }
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.view = b.dataset.v; history.replaceState(null, "", "#" + S.view); setTabs(); render(); });

async function load() {
  const since = new Date(Date.now() - 7 * 86400000).toISOString();
  const [s, j, f] = await Promise.all([
    sb.from("saves").select(SAVE_SELECT).eq("profile_id", S.me.profileId).order("created_at", { ascending: false }).limit(1000),
    sb.from("ingest_jobs").select("id, platform, input_url, status, error, created_at").in("status", ["queued", "processing", "needs_device"]).neq("source", "import").gte("created_at", since).order("created_at", { ascending: false }),
    sb.from("ingest_jobs").select("id, platform, input_url, status, created_at").eq("status", "failed").neq("source", "import").gte("created_at", new Date(Date.now() - 3 * 86400000).toISOString()).order("created_at", { ascending: false }).limit(20),
  ]);
  if (s.error?.code === "PGRST301" || s.error?.status === 401) return showLogin("もう一度コードを入れてください");
  S.saves = s.data ?? []; S.pending = j.data ?? []; S.failed = f.data ?? [];
  render();
}

let reloadT;
function subscribe() {
  sb.channel("web-" + Math.random().toString(36).slice(2))
    .on("postgres_changes", { event: "*", schema: "public", table: "saves" }, () => { clearTimeout(reloadT); reloadT = setTimeout(load, 400); })
    .on("postgres_changes", { event: "*", schema: "public", table: "ingest_jobs" }, () => { clearTimeout(reloadT); reloadT = setTimeout(load, 400); })
    .subscribe();
  // 念のため：取り込み中があるあいだは少しずつ見に行く
  setInterval(() => { if (S.pending.some((p) => p.status !== "needs_device")) load(); }, 5000);
}

function render() {
  const m = $("main");
  if (S.view === "list") m.innerHTML = renderList();
  else if (S.view === "map") { m.innerHTML = `<div class="head"><h1>地図</h1><span class="muted small" id="mapInfo"></span><div class="spacer"></div><label class="small"><input type="checkbox" id="openOnly"> 今あいている店だけ</label></div><div id="map"></div>`; drawMap(); }
  else if (S.view === "plans") renderPlans();
  else if (S.view === "lists") renderLists();
  else if (S.view === "shop") renderShop();
}

// ---------- 一覧 ----------
function filtered() {
  let xs = S.saves;
  if (S.cat === "review") xs = xs.filter((s) => s.needs_review);
  else if (S.cat !== "all") xs = xs.filter((s) => s.categories.includes(S.cat));
  const q = S.q.trim().toLowerCase();
  if (q) {
    const words = q.split(/\s+/);
    xs = xs.filter((s) => {
      const hay = [s.title, s.summary, s.author, s.memo, ...(s.tags || []), ...(s.places || []).flatMap((p) => [p.name, p.area, p.address]), JSON.stringify(s.details || {})].join(" ").toLowerCase();
      return words.every((w) => hay.includes(w));
    });
  }
  return xs;
}

function renderList() {
  const count = (c) => c === "all" ? S.saves.length : c === "review" ? S.saves.filter((s) => s.needs_review).length : S.saves.filter((s) => s.categories.includes(c)).length;
  const chip = (c, label) => `<button class="chip ${S.cat === c ? "on" : ""} ${c === "review" ? "warn" : ""}" data-cat="${c}">${label} <span class="n">${count(c)}</span></button>`;
  const reviewN = count("review");
  const chips = `<div class="chips">${chip("all", "すべて")}${CATS.map((c) => chip(c, CAT[c].label)).join("")}${reviewN ? chip("review", "あとで分ける") : ""}</div>`;
  const pend = S.pending.length ? `<div class="pending">${S.pending.map((p) => `<div class="pend">${p.status === "needs_device" ? "📱" : '<span class="dot"></span>'}<span class="u">${esc(p.input_url || "画像")}</span><span>${p.status === "needs_device" ? "スマホのアプリを開くと読み取ります" : "読み取り中…"}</span></div>`).join("")}</div>` : "";
  const fail = S.failed.length ? `<div class="ai" style="background:var(--warn);border-color:#F3DFB5"><div class="bold">読み取れなかった保存 ${S.failed.length}件</div><div class="small muted" style="margin-bottom:6px">投稿が消されたか非公開の可能性があります。スクショを保存すると画像から読み取れます。</div>${S.failed.slice(0, 5).map((j) => `<div class="pend" style="margin-top:6px"><span class="u">${esc(j.input_url || "画像")}</span>${j.input_url ? `<button class="btn sm" data-retry="${j.id}">もう一度</button>` : ""}<button class="btn out sm" data-dismiss="${j.id}">消す</button></div>`).join("")}</div>` : "";
  let ai = "";
  if (S.ai) {
    const byId = Object.fromEntries(S.saves.map((s) => [s.id, s]));
    const rows = S.ai.loading ? `<p class="muted small" style="margin:0">AIが探しています…</p>` : S.ai.results.filter((r) => byId[r.id]).map((r) => `<button class="row" data-open="${r.id}"><div style="flex:1"><div class="bold">${esc(byId[r.id].title)}</div><div class="small muted">${esc(r.reason)}</div></div>${byId[r.id].categories.map(tag).join("")}</button>`).join("") || `<p class="muted small" style="margin:0">見つかりませんでした</p>`;
    ai = `<div class="ai"><div class="small bold" style="margin-bottom:4px">AIの答え：「${esc(S.ai.q)}」</div>${rows}</div>`;
  }
  const xs = filtered();
  if (!S.saves.length) return chips + pend + `<div class="empty"><b>まだ保存がありません</b>右上の「＋ 保存」でリンクを貼るか、このページで Ctrl+V（⌘V）するとそのまま保存できます。<br>スマホのアプリや LINE で保存したものも、ここに並びます。</div>`;
  const cards = xs.map(cardHtml).join("");
  return chips + pend + fail + ai + (cards ? `<div class="grid">${cards}</div>` : `<div class="empty"><b>当てはまる保存がありません</b>${S.q ? "Enter で AI にも聞けます" : ""}</div>`);
}

function cardHtml(s) {
  const c = s.categories[0], ph = c ? CAT[c] : { bg: "#EEEDE8", fg: "#5F6068", label: "？" };
  const img = s.thumbnail_url ? `<img loading="lazy" src="${esc(s.thumbnail_url)}" alt="" onerror="this.remove()">` : "";
  const place = (s.places || [])[0];
  const meta = [PLATFORM[s.platform], fmtDate(s.created_at), place ? "📍" + (place.area || place.name) : "", s.deadline ? "⏰" + s.deadline.slice(5).replace("-", "/") + "まで" : ""].filter(Boolean).map(esc).join("・");
  return `<button class="card" data-open="${s.id}">
    <div class="thumb ${img ? "" : "none"}"><div class="ph" style="background:${ph.bg};color:${ph.fg}">${ph.label}</div>${img}</div>
    <div class="b"><div>${s.needs_review ? '<span class="tag" style="background:#FFF8EC;color:#92400E">あとで分ける</span>' : ""}${(img ? s.categories : s.categories.slice(1)).map(tag).join("")}</div>
    <div class="t">${esc(s.title)}</div>${s.summary ? `<div class="s">${esc(s.summary)}</div>` : ""}
    <div class="m">${meta}</div></div></button>`;
}

$("main").addEventListener("click", async (e) => {
  const r = e.target.closest("[data-retry]"), d = e.target.closest("[data-dismiss]");
  if (r || d) {
    const j = S.failed.find((x) => x.id === (r || d).dataset.retry || x.id === (r || d).dataset.dismiss); if (!j) return;
    if (r) { r.disabled = true; try { await call("ingest", { url: j.input_url, async: true }); toast("もう一度読み取っています…"); } catch (err) { toast(err.message); return load(); } }
    await sb.from("ingest_jobs").delete().eq("id", j.id); return load();
  }
  const c = e.target.closest("[data-cat]"); if (c) { S.cat = c.dataset.cat; render(); return; }
  const o = e.target.closest("[data-open]"); if (o) openSave(o.dataset.open);
});

let qT;
$("q").addEventListener("input", (e) => { S.q = e.target.value; if (!S.q) S.ai = null; clearTimeout(qT); qT = setTimeout(() => { if (S.view !== "list") { S.view = "list"; setTabs(); } render(); }, 120); });
$("q").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || !S.q.trim()) return;
  const q = S.q.trim(); S.ai = { q, loading: true, results: [] }; S.view = "list"; setTabs(); render();
  try { const r = await call("assist", { action: "search", query: q }); S.ai = { q, results: r.results ?? [] }; }
  catch { S.ai = { q, results: [] }; }
  render();
});

// ---------- 詳細 ----------
function openSave(id) {
  const s = S.saves.find((x) => x.id === id) || S.extra[id]; if (!s) return;
  S.openId = id;
  $("layer").innerHTML = `<div class="veil" id="veil"><div class="panel" role="dialog" aria-label="保存の詳細">${detailHtml(s)}</div></div>`;
  $("veil").addEventListener("click", (e) => { if (e.target.id === "veil") closeLayer(); });
  bindDetail(s);
}
function closeLayer() { $("layer").innerHTML = ""; S.openId = null; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLayer(); });

function detailHtml(s) {
  const d = s.details || {};
  const mine = s.profile_id === S.me.profileId; // 共有リストで見ている他の人の保存は、見るだけ

    const open = isOpenNow(p.opening_hours), th = todayHours(p.opening_hours);

    return `<div class="place ${p.needs_confirm ? "warn" : ""}">
      <div class="bold">${esc(p.name)} ${p.visited ? '<span class="tag" style="background:#DCFCE7;color:#166534">行った</span>' : ""}</div>
      <div class="small muted">${esc(addr(p.address) || p.area || "")}</div>
      ${th || open !== null ? `<div class="small">${open === true ? '<b style="color:var(--ok)">営業中</b>' : open === false ? '<b style="color:var(--danger)">営業時間外</b>' : ""} ${th ? "今日 " + esc(th) : ""}</div>` : ""}
      ${p.notes ? `<div class="small muted">${esc(p.notes)}</div>` : ""}${p.google_rating ? `<div class="small muted">Googleの評価 ★${p.google_rating.toFixed(1)}${p.google_rating_count ? `（${p.google_rating_count.toLocaleString()}件）` : ""}</div>` : ""}${p.price_range ? `<div class="small muted">${esc(p.price_range)}</div>` : ""}
      <div class="links"><a class="btn sm" target="_blank" rel="noopener" href="${mapsUrl(p)}">Googleマップ</a><a class="btn out sm" target="_blank" rel="noopener" href="${tabelogUrl(p)}">食べログ</a>${mine ? `<button class="btn out sm" data-visit="${i}">${p.visited ? "行ってない" : "行った"}</button>` : ""}</div>${mine ? cands : ""}</div>`;
  }).join("");
  const recipe = d.recipe?.ingredients?.length || d.recipe?.steps?.length ? `<div class="box"><h3>材料${d.recipe.servings ? `（${d.recipe.servings}人分）` : ""}</h3>${[d.recipe.minutes && `約${d.recipe.minutes}分`, d.recipe.kcal && `1人分 約${d.recipe.kcal}kcal`, d.recipe.protein_g && `たんぱく質 約${d.recipe.protein_g}g`].filter(Boolean).length ? `<div class="small" style="margin-bottom:6px"><b>${[d.recipe.minutes && `約${d.recipe.minutes}分`, d.recipe.kcal && `1人分 約${d.recipe.kcal}kcal`, d.recipe.protein_g && `たんぱく質 約${d.recipe.protein_g}g`].filter(Boolean).join("・")}</b> <span class="muted">（AIの目安）</span></div>` : ""}<ul class="clean">${(d.recipe.ingredients || []).map((x) => `<li>${esc(x.name)}${x.quantity ? ` <span class="muted">${esc(x.quantity)}</span>` : ""}</li>`).join("")}</ul>
    ${d.recipe.ingredients?.length ? `<div style="margin-top:10px"><button class="btn sm" id="toShop">材料を買い物リストに入れる</button></div>` : ""}
    ${d.recipe.steps?.length ? `<h3 style="margin-top:14px">作り方</h3><ol class="steps2">${d.recipe.steps.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}</div>` : "";
  const products = d.products?.length ? `<div class="box"><h3>紹介されていた物</h3>${d.products.map((p) => { const q = [p.brand, p.name].filter(Boolean).join(" "); return `<div class="place"><div class="bold">${esc(q)}</div>${p.kind ? `<div class="small muted">${esc(p.kind)}</div>` : ""}<div class="links"><a class="btn out sm" target="_blank" rel="noopener" href="${rakutenUrl(q)}">楽天で探す</a><a class="btn out sm" target="_blank" rel="noopener" href="${amazonUrl(q)}">Amazonで探す</a></div></div>`; }).join("")}</div>` : "";
  const works = d.works?.length ? `<div class="box"><h3>作品</h3>${d.works.map((w) => `<div class="place"><div class="bold">${esc(w.title)}</div><div class="small muted">${esc([w.kind, w.where].filter(Boolean).join("・"))}</div></div>`).join("")}</div>` : "";
  return `<div class="top"><button class="btn out sm" id="close">✕ 閉じる</button><div class="spacer"></div>${/iPhone|iPad|Android/i.test(navigator.userAgent) ? `<button class="btn out sm" id="inApp">アプリで開く</button>` : ""}${s.source_url ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(s.source_url)}">元の投稿を開く ↗</a>` : ""}</div>
  <div class="in">
    ${s.thumbnail_url ? `<div class="hero"><img src="${esc(s.thumbnail_url)}" alt="" onerror="this.parentNode.remove()"></div>` : ""}
    <div><div class="small muted">${esc([PLATFORM[s.platform], s.author, new Date(s.created_at).toLocaleDateString("ja-JP")].filter(Boolean).join("・"))}${s.is_pr ? "・PR" : ""}</div><h2>${esc(s.title)}</h2></div>
    ${d.event?.date ? `<div class="box" style="background:var(--warn)"><b>${esc(d.event.date.replaceAll("-", "/"))}${d.event.time ? " " + esc(d.event.time) : ""} 開催</b></div>` : ""}
    ${s.deadline ? `<div class="box" style="background:var(--warn)"><b>⏰ ${esc(s.deadline.replaceAll("-", "/"))} まで</b></div>` : ""}
    ${mine ? "" : `<div class="box small muted">共有リストのメンバーの保存です（見るだけ）</div>`}
    ${mine ? `<div class="box"><h3>予定</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="field" type="date" id="planDate" value="${esc(s.plan_date || "")}" style="width:auto">
      <select class="field" id="planSlot" style="width:auto">${[["", "いつでも"], ["morning", "あさ"], ["noon", "ひる"], ["night", "よる"]].map(([v, l]) => `<option value="${v}" ${(s.plan_slot || "") === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${s.plan_date ? `<a class="btn out sm" target="_blank" rel="noopener" href="${gcalUrl(s)}">Googleカレンダーに入れる</a><button class="btn out sm" id="planClear">予定から外す</button>` : ""}
      <div class="spacer"></div><button class="btn ${s.done_at ? "" : "out"}" id="done" style="${s.done_at ? "background:var(--ok)" : ""}">${s.done_at ? doneVerb(s) + "！" : doneVerb(s)}</button></div></div>` : ""}
    <div class="box ${mine ? "" : "hide"}"><h3>分類 <span class="muted small" style="font-weight:400">（押して切り替え）</span></h3><div class="cats" id="cats">${CATS.map((c) => `<button data-c="${c}" style="${s.categories.includes(c) ? `background:${CAT[c].bg};color:${CAT[c].fg};border-color:${CAT[c].accent}` : "background:#F5F4F0;color:#5F6068"}">${CAT[c].label}<span class="small" style="font-weight:400"> ${CAT[c].sub}</span></button>`).join("")}</div></div>
    ${s.summary ? `<div class="box"><h3>まとめ</h3><div>${esc(s.summary)}</div></div>` : ""}
    ${places ? `<div class="box"><h3>お店・スポット</h3>${places}</div>` : ""}
    ${recipe}${products}${works}
    ${mine ? `<div class="box"><h3>タグ</h3><input class="field" id="tags" value="${esc((s.tags || []).join("、"))}" placeholder="「、」で区切って入力"></div>
    <div class="box"><h3>メモ</h3><textarea class="field" id="memo" placeholder="自分用のメモ">${esc(s.memo || "")}</textarea></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn out" id="toList">リストに入れる</button><div class="spacer"></div><button class="btn danger" id="del">この保存を消す</button></div>` : ""}
  </div>`;
}

function bindDetail(s) {
  if ($("inApp")) $("inApp").onclick = () => openInApp();
  $("close").onclick = closeLayer;
  const refresh = () => { const p = document.querySelector(".panel"); const top = p.scrollTop; p.innerHTML = detailHtml(s); p.scrollTop = top; bindDetail(s); render(); };
  $("cats").onclick = async (e) => {
    const b = e.target.closest("[data-c]"); if (!b) return;
    const c = b.dataset.c, before = s.categories;
    s.categories = before.includes(c) ? before.filter((x) => x !== c) : [...before, c]; s.needs_review = false; refresh();
    await sb.from("saves").update({ categories: s.categories, needs_review: false, updated_at: new Date().toISOString() }).eq("id", s.id);
    await sb.from("corrections").insert({ profile_id: S.me.profileId, save_id: s.id, before: { title: s.title, categories: before }, after: { categories: s.categories } });
  };
  if ($("toShop")) $("toShop").onclick = async () => { const items = s.details.recipe.ingredients.map((x) => ({ profile_id: S.me.profileId, save_id: s.id, name: x.name, quantity: x.quantity ?? null })); await sb.from("shopping_items").insert(items); S.shop = null; toast(`材料 ${items.length}品を買い物リストに入れました`); };
  if ($("planDate")) {
    const savePlan = async () => { s.plan_date = $("planDate").value || null; s.plan_slot = s.plan_date ? ($("planSlot").value || null) : null; refresh(); await sb.from("saves").update({ plan_date: s.plan_date, plan_slot: s.plan_slot }).eq("id", s.id); toast(s.plan_date ? "予定に入れました" : "予定から外しました"); };
    $("planDate").onchange = savePlan; $("planSlot").onchange = savePlan;
    if ($("planClear")) $("planClear").onclick = () => { $("planDate").value = ""; savePlan(); };
    $("done").onclick = async () => { await toggleDone(s); refresh(); };
  }
  if (!$("memo")) return;
  $("memo").onblur = async (e) => { if ((s.memo || "") === e.target.value) return; s.memo = e.target.value; await sb.from("saves").update({ memo: s.memo }).eq("id", s.id); toast("メモを保存しました"); };
  $("tags").onchange = async (e) => { s.tags = e.target.value.split(/[、,，\s]+/).map((x) => x.replace(/^#/, "").trim()).filter(Boolean); await sb.from("saves").update({ tags: s.tags }).eq("id", s.id); toast("タグを保存しました"); };
  $("del").onclick = async () => { if (!confirm("この保存を消しますか？元に戻せません。")) return; await sb.from("saves").delete().eq("id", s.id); S.saves = S.saves.filter((x) => x.id !== s.id); closeLayer(); render(); toast("消しました"); };
  $("toList").onclick = () => pickList(s);
  document.querySelectorAll("[data-visit]").forEach((b) => b.onclick = async () => { const p = s.places[+b.dataset.visit]; p.visited = !p.visited; refresh(); await sb.from("places").update({ visited: p.visited, visited_at: p.visited ? new Date().toISOString() : null }).eq("id", p.id); });
  document.querySelectorAll("[data-cand]").forEach((b) => b.onclick = async () => {
    const [i, k] = b.dataset.cand.split(":"); const p = s.places[+i];
    const patch = k === "x" ? { needs_confirm: false } : (({ name, address, google_place_id, lat, lng }) => ({ name, address: address ?? null, google_place_id: google_place_id ?? null, lat: lat ?? null, lng: lng ?? null, needs_confirm: false }))(p.candidates[+k]);
    Object.assign(p, patch); refresh(); await sb.from("places").update(patch).eq("id", p.id);
  });
}

async function pickList(s) {
  const { data } = await sb.from("lists").select("id, title, color").order("created_at", { ascending: false });
  const ls = data ?? [];
  modal(`<h2>リストに入れる</h2>${ls.map((l) => `<button class="li" data-l="${l.id}"><span class="sw" style="background:${esc(l.color)}"></span><b>${esc(l.title)}</b></button>`).join("") || '<p class="muted">まだリストがありません</p>'}
    <div style="display:flex;gap:8px"><input class="field" id="newList" placeholder="新しいリストの名前"><button class="btn" id="mk">作って入れる</button></div>`, (root) => {
    root.querySelectorAll("[data-l]").forEach((b) => b.onclick = async () => { await sb.from("list_items").upsert({ list_id: b.dataset.l, save_id: s.id, added_by: S.me.profileId }, { onConflict: "list_id,save_id" }); closeModal(); toast("リストに入れました"); S.lists = null; });
    root.querySelector("#mk").onclick = async () => { const id = await createList(root.querySelector("#newList").value); if (!id) return; await sb.from("list_items").insert({ list_id: id, save_id: s.id, added_by: S.me.profileId }); closeModal(); toast("リストを作って入れました"); };
  });
}

// ---------- モーダル ----------
function modal(html, bind) {
  const d = document.createElement("div"); d.className = "modal"; d.id = "modal";
  d.innerHTML = `<div class="sheet">${html}<button class="btn out" data-x>閉じる</button></div>`;
  d.addEventListener("click", (e) => { if (e.target === d || e.target.closest("[data-x]")) closeModal(); });
  document.body.appendChild(d); bind?.(d);
}
function closeModal() { $("modal")?.remove(); }

// ---------- 保存する ----------

  <p class="small muted" style="margin:0">X・Instagram・TikTok・YouTube・お店のページなどのリンクを貼ってください。1行に1つずつ、まとめて貼れます。</p>

  <button class="btn" id="go">保存する</button>
  <p class="small muted" style="margin:0">Instagram と TikTok は、スマホのアプリを次に開いたときに中身を読み取ります。</p>`, (root) => {
  const ta = root.querySelector("#urls"); setTimeout(() => ta.focus(), 30);

  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.remove("over"); saveFiles(e.dataTransfer.files).then((n) => n && closeModal()); };

async function saveUrls(text) {
  const urls = [...new Set((text.match(/https?:\/\/[^\s<>"'）)]+/g) || []))].slice(0, 30);
  if (!urls.length) { toast("リンクが見つかりません"); return 0; }
  let ok = 0;
  for (const url of urls) {
    try { await call("ingest", { url, async: true }); ok++; } catch (e) { toast(e.message); }
  }
  if (ok) { toast(ok === 1 ? "保存しました。読み取っています…（スマホなら投稿の「共有」から2タップ）" : `${ok}件を保存しました。読み取っています…`); load(); }
  return ok;
}

async function saveFiles(files) {
  const imgs = [...files].filter((f) => f.type.startsWith("image/")).slice(0, 10);
  let ok = 0;
  for (const f of imgs) {
    try {
      const { b64, type } = await shrink(f);
      await call("ingest", { image: b64, mediaType: type, async: true }); ok++;
    } catch (e) { toast(e.message); }
  }
  if (ok) { toast(`画像${ok}枚を保存しました。読み取っています…`); load(); }
  return ok;
}

// 大きい画像は縮めてから送る（長い辺 2000px・JPEG）
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.86); URL.revokeObjectURL(img.src);
      resolve({ b64: url.split(",")[1], type: "image/jpeg" });
    };
    img.onerror = () => reject(new Error("画像を読めませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

// ページのどこでも Ctrl+V（⌘V）でそのまま保存
document.addEventListener("paste", (e) => {
  if ($("app").classList.contains("hide")) return;
  const t = e.target; if (t.closest && t.closest("input, textarea")) return;
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); saveFiles(files); return; }
  const text = e.clipboardData?.getData("text") || "";
  if (/https?:\/\//.test(text)) { e.preventDefault(); saveUrls(text); }
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); if ($("modal") || $("app").classList.contains("hide")) return; if (e.dataTransfer.files.length) saveFiles(e.dataTransfer.files); else saveUrls(e.dataTransfer.getData("text")); });

async function drawMap() {
  try { await loadLeaflet(); } catch { $("map").innerHTML = '<div class="empty">地図を読み込めませんでした</div>'; return; }
  const draw = () => {
    if (S.mapObj) { S.mapObj.remove(); S.mapObj = null; }
    const openOnly = $("openOnly")?.checked;
    const pts = [];
    for (const s of S.saves) for (const p of s.places || []) {
      if (p.lat == null || p.lng == null) continue;
      if (openOnly && isOpenNow(p.opening_hours) !== true) continue;
      pts.push({ s, p });
    }
    $("mapInfo").textContent = `${pts.length}か所`;
    const m = L.map("map", { zoomControl: true }); S.mapObj = m;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(m);
    if (!pts.length) { m.setView([35.681, 139.767], 11); return; }
    const b = [];
    for (const { s, p } of pts) {
      const col = CAT[s.categories[0]]?.accent || "#1A1A1E";
      const mk = L.circleMarker([p.lat, p.lng], { radius: 8, color: "#fff", weight: 2, fillColor: p.visited ? "#9CA3AF" : col, fillOpacity: 1 }).addTo(m);
      mk.bindPopup(`<b>${esc(p.name)}</b><br><span style="color:#5F6068">${esc(s.title)}</span><br><a target="_blank" rel="noopener" href="${mapsUrl(p)}">Googleマップ</a>・<a href="#" data-pop="${s.id}">くわしく</a>`);
      b.push([p.lat, p.lng]);
    }
    m.fitBounds(b, { padding: [40, 40], maxZoom: 15 });
    m.on("popupopen", (e) => { e.popup.getElement().querySelector("[data-pop]")?.addEventListener("click", (ev) => { ev.preventDefault(); openSave(ev.target.dataset.pop); }); });
  };

}

const SLOT = { morning: "あさ", noon: "ひる", night: "よる" };
const DONE_VERB = { go: "行った", cook: "作った", buy: "買った", watch: "観た", learn: "やってみた" };
const doneVerb = (s) => DONE_VERB[s.categories?.[0]] || "やった";
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function dayLabel(v) { const [y, m, d] = v.split("-").map(Number); const dt = new Date(y, m - 1, d); const diff = Math.round((dt - new Date(new Date().toDateString())) / 86400000); return `${diff === 0 ? "今日 " : diff === 1 ? "明日 " : ""}${m}/${d}（${"日月火水木金土"[dt.getDay()]}）`; }
async function toggleDone(s) {
  const at = s.done_at ? null : new Date().toISOString(); s.done_at = at;
  await sb.from("saves").update({ done_at: at }).eq("id", s.id);
  if (s.places?.length) { s.places.forEach((p) => (p.visited = !!at)); await sb.from("places").update({ visited: !!at, visited_at: at }).eq("save_id", s.id); }
  toast(at ? `${doneVerb(s)}にしました` : "やってないに戻しました");
}
function gcalUrl(s) {
  const [y, m, d] = s.plan_date.split("-").map(Number); const h = { morning: 9, noon: 12, night: 19 }[s.plan_slot];
  const p2 = (n) => String(n).padStart(2, "0");
  let dates;
  if (h == null) { const e = new Date(y, m - 1, d + 1); dates = `${y}${p2(m)}${p2(d)}/${e.getFullYear()}${p2(e.getMonth() + 1)}${p2(e.getDate())}`; }
  else { const st = new Date(y, m - 1, d, h), en = new Date(st.getTime() + 7200000); const f = (x) => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); dates = `${f(st)}/${f(en)}`; }
  const pl = s.places?.[0];
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: s.title, dates, details: [s.summary, s.source_url].filter(Boolean).join("\n"), location: pl?.address || pl?.name || "", ctz: "Asia/Tokyo" });
}
function renderPlans() {
  const today = ymd(new Date()), now = new Date();
  const inMonth = (iso) => { if (!iso) return false; const d = new Date(iso); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); };
  const saved = S.saves.filter((s) => inMonth(s.created_at)).length, done = S.saves.filter((s) => inMonth(s.done_at)).length;
  const planned = S.saves.filter((s) => s.plan_date && !s.done_at).sort((a, b) => (a.plan_date < b.plan_date ? -1 : a.plan_date > b.plan_date ? 1 : 0));
  const groups = {}; for (const s of planned) (groups[s.plan_date < today ? "past" : s.plan_date] ??= []).push(s);
  const keys = Object.keys(groups).sort((a, b) => (a === "past" ? -1 : b === "past" ? 1 : a < b ? -1 : 1));
  $("main").innerHTML = `<div class="head"><h1>予定</h1><span class="muted small">${now.getMonth() + 1}月はとっといた ${saved}件・やった ${done}件</span></div>
  ${keys.length ? keys.map((k) => `<h3 style="margin:18px 0 8px;${k === "past" ? "color:var(--danger)" : ""}">${k === "past" ? "過ぎた予定（まだやっていない）" : dayLabel(k)}</h3>
    ${groups[k].map((s) => `<div class="box" style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <div style="width:64px;text-align:center;border-right:2px dashed var(--line);padding-right:10px"><div class="small bold" style="color:${CAT[s.categories[0]]?.fg || "inherit"}">${CAT[s.categories[0]]?.label || ""}</div><div class="bold" style="font-size:22px">${Number(s.plan_date.slice(8))}</div><div class="small muted">${SLOT[s.plan_slot] || "いつでも"}</div></div>
      <div style="flex:1;min-width:0;cursor:pointer" data-open="${s.id}"><div class="bold">${esc(s.title)}</div><div class="small muted">${esc((s.places || []).map((p) => p.name).join("・") || s.summary || "")}</div></div>
      <button class="btn out sm" data-done="${s.id}">${doneVerb(s)}</button></div>`).join("")}`).join("")
    : `<div class="box muted">まだ予定がありません。保存を開いて「予定」で日にちを選ぶと、ここに並びます。</div>`}`;
  $("main").querySelectorAll("[data-open]").forEach((el) => (el.onclick = () => openSave(el.dataset.open)));
  $("main").querySelectorAll("[data-done]").forEach((el) => (el.onclick = async () => { const s = S.saves.find((x) => x.id === el.dataset.done); await toggleDone(s); renderPlans(); }));
}

  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["タイトル", "分類", "まとめ", "お店・スポット", "住所", "元の投稿", "タグ", "メモ", "保存日"]];
  for (const s of S.saves) rows.push([s.title, s.categories.map((c) => CAT[c]?.label).join("・"), s.summary, (s.places || []).map((p) => p.name).join(" / "), (s.places || []).map((p) => addr(p.address)).join(" / "), s.source_url, (s.tags || []).join(" "), s.memo, new Date(s.created_at).toLocaleDateString("ja-JP")]);
  const blob = new Blob(["﻿" + rows.map((r) => r.map(q).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tottoku.csv"; a.click();
}

boot();
</script>
</body>
</html>
